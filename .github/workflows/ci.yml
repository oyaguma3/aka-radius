name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# 同じブランチで新しく push したら、古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      # 第三者の Action はコミットの SHA で固定する（PoC セットの決まり）。
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: Test
        run: make test-race

  docker:
    name: イメージと compose の設定
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # auth・acct・admin・gateway は同じイメージ（サブコマンドで切り替える）
      - name: イメージのビルド
        run: |
          docker build -t aka-radius:ci .
          # サブコマンドなしでは使い方を出して終了コード 2 で終わる
          set +e
          docker run --rm aka-radius:ci
          code=$?
          set -e
          test "$code" -eq 2

      - name: compose の設定
        working-directory: deployments
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.aka-av.yml --profile admin config -q
          docker compose -f docker-compose.yml -f docker-compose.aka-av.yml --profile admin config --services
          # VALKEY_PASSWORD が空なら、compose が断る。
          sed -i 's|^VALKEY_PASSWORD=.*|VALKEY_PASSWORD=|' .env
          ! docker compose -f docker-compose.yml config -q 2>/dev/null
