openapi: 3.0.3
info:
  title: aka-radius 管理API
  version: 2.0.0
  description: |
    加入者（状態・認証ベクターの取得先・認可ポリシーのルール）を操作し、ノードの状態と監査ログを読み出す API。
    MVP セットでは、管理クライアントは aka-provisioner だけ（設計概要 §11）。
    本PoC の Provisioning API 0.4.0（`/admin/v1`、`docs/openapi/provisioning-api.yaml`）の後継で、互換は持たない。

    2.0.0-draft（MVP セットの段階 2-3）:
    - パスを `/admin/v2` にした。
    - 加入者と認可ポリシーを 1 つのリソースにした。加入者は状態（`active` / `inactive` / `terminated`）、
      認証ベクターの取得先（`sourceId`）、認可ポリシーのルール（`rules`）を持つ。本PoC の `default`（allow / deny）はなくし、
      どのルールにも一致しなければ拒否する（設計概要 §8.2）。
    - 状態の変更は `PUT /subscribers/{imsi}/state`、terminated からの戻しは `POST /subscribers/{imsi}/reinstate`。
      `active` は物理削除できず、`terminated` は変更できない（aka-vecgen と同じ規則）。
    - 加入者の一括取得 `POST /subscribers/batch-get` を足した。
    - 鍵（`/subscribers/{imsi}/keys`）、認可ポリシー（`/policies`）、RADIUSクライアントの書き込みと `/clients/{id}/secret` をなくした。

    2.0.0-draft（MVP セットの段階 2-4）:
    - セッションの一覧 `GET /sessions`（テナントか IMSI で絞る）と、利用の集計 `GET /usage`（日本時間の 1 日ごと）を足した。
    - `/status` に、セッションの数と数えた時刻（`sessionCount`・`sessionsCountedAt`）を足した。

    2.0.0（MVP セットの段階 2-5）:
    - RADIUS クライアントの一覧 `GET /clients`（共有シークレットは返さない。書き込みはノードの上のコマンド `aka-radius client`）と、
      取得先の登録簿 `GET /sources`（証明書の主体名・期限・フィンガープリント、遮断器の状態。鍵とファイルのパスは返さない）を足した。
    - `/status` に、RADIUS クライアントの数（`clientCount`）、取得先ごとの遮断器の状態（`circuitBreaker`）、
      管理クライアントのピンを読んだ時刻（`adminClientsLoadedAt`）を足した。
    - 監査ログを日ごとのファイルにも書くようにし、コマンドの操作（管理クライアント `cli`）も残すようにした。

    認証:
    - mTLS 必須。管理クライアントのピンのファイル（`RADIUS_ADMIN_CLIENTS_FILE`）に書いた証明書（SHA-256 のフィンガープリント）だけを
      受け付ける。ピンのファイルとサーバー証明書は SIGHUP で読み直す。同じ識別名に新旧 2 つのフィンガープリントを書ける。
    - 証明書なし、または未登録の証明書による接続は TLS ハンドシェイクで拒否する。
    - 管理クライアントは全権として扱う。誰が何をしてよいかは aka-ossbss が決める。

    監査ログ:
    - 変更操作は監査ログに記録する（Valkey の Stream `audit` と、日ごとのファイル `audit-YYYYMMDD.jsonl`。日付は日本時間）。
      ノードの上のコマンド（RADIUS クライアントの書き込み、管理API のサーバー証明書の作成）も、管理クライアント `cli` として記録する。
    - 管理クライアントは `X-Operator-Id` ヘッダーで操作者 ID を渡す。

    トレース:
    - 管理クライアントは `X-Trace-ID` ヘッダーでトレースID を渡せる。サーバーはそれをログ（`ADMIN_REQUEST`、`AUDIT` の `trace_id`）と
      監査ログの `traceId` に残し、応答の `X-Trace-ID` ヘッダーで返す。

    冪等性:
    - `Idempotency-Key` は扱わない。再送の判定は aka-provisioner が行う。登録は「既にあれば 409」、削除は「なければ 404」。

    表記:
    - 日時は RFC 3339 形式の UTC。
    - エラーは ProblemDetails（`application/problem+json`）で返す。`cause` の名前は本PoC の Provisioning API と aka-vecgen の管理API にそろえる。

servers:
  - url: https://{host}:{port}/admin/v2
    variables:
      host:
        default: localhost
      port:
        default: '9444'

tags:
  - name: status
    description: ノードの状態
  - name: subscribers
    description: 加入者
  - name: sessions
    description: セッションと利用の集計
  - name: config
    description: RADIUS クライアントと取得先の登録簿（読み出しだけ）
  - name: logs
    description: 監査ログ

paths:
  /status:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [status]
      summary: ノードの状態を取得する
      operationId: getStatus
      responses:
        '200':
          description: ノードの状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers:
    parameters:
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [subscribers]
      summary: 加入者の一覧を取得する
      operationId: listSubscribers
      description: IMSI の辞書順で返す。
      parameters:
        - name: prefix
          in: query
          description: IMSI の前方一致条件。
          schema:
            type: string
            pattern: '^[0-9]{1,15}$'
        - name: cursor
          in: query
          description: 前のページの `nextCursor`。省略時は先頭から返す。
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: 加入者の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [subscribers]
      summary: 加入者を登録する
      operationId: createSubscriber
      description: |
        `sourceId` は取得先の登録簿にある ID でなければならない（なければ 400 の `UNKNOWN_SOURCE`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberCreate'
            example:
              imsi: '440100123456789'
              state: active
              sourceId: vecgen
              rules:
                - tenantId: 42
                  nasId: '*'
                  ssids: ['*']
                  vlanId: 100
                  sessionTimeout: 3600
      responses:
        '201':
          description: 登録した加入者
          headers:
            Location:
              description: 登録した加入者の URI
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 同じ IMSI の加入者が既に存在する。`cause` は `SUBSCRIBER_ALREADY_EXISTS`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers/{imsi}:
    parameters:
      - $ref: '#/components/parameters/Imsi'
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [subscribers]
      summary: 加入者を取得する
      operationId: getSubscriber
      responses:
        '200':
          description: 加入者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [subscribers]
      summary: 加入者を変更する
      operationId: updateSubscriber
      description: |
        指定した項目だけを変更する（JSON Merge Patch）。`rules` を指定した場合は、配列全体を置き換える。
        状態（`state`）は変えられない（指定すると 400 の `OPTIONAL_IE_INCORRECT`）。
        `terminated` の加入者は変更できない（409）。
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/SubscriberUpdate'
            example:
              rules:
                - tenantId: 42
                  nasId: tenant42-ap-01
                  ssids: [corp, guest]
      responses:
        '200':
          description: 変更後の加入者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '409':
          description: 加入者が `terminated` で変更できない。`cause` は `SUBSCRIBER_TERMINATED`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [subscribers]
      summary: 加入者を物理削除する
      operationId: deleteSubscriber
      description: |
        `active` の加入者は削除できない（先に `inactive` か `terminated` にする）。
        セッションは消さない（期限で消える）。削除時点の状態・取得先・ルールを監査ログに記録する。
      responses:
        '204':
          description: 削除した
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '409':
          description: 加入者が `active` で削除できない。`cause` は `SUBSCRIBER_ACTIVE`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers/{imsi}/state:
    parameters:
      - $ref: '#/components/parameters/Imsi'
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    put:
      tags: [subscribers]
      summary: 加入者の状態を変える
      operationId: setSubscriberState
      description: |
        `active` ⇔ `inactive`、`active` / `inactive` → `terminated` に変える。
        `terminated` からは変えられない（`POST /subscribers/{imsi}/reinstate` を使う）。
        同じ状態への変更は何もせず 200 を返し、監査ログ（`subscriber.state`、`unchanged`）には残す。
        aka-radius の状態は aka-vecgen の状態とは独立に変わる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChange'
            example:
              state: inactive
              reason: 料金の未払い
      responses:
        '200':
          description: 変更後の加入者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '409':
          description: 状態の移り方の規則で許されない（`terminated` からの変更）。`cause` は `STATE_TRANSITION_NOT_ALLOWED`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers/{imsi}/reinstate:
    parameters:
      - $ref: '#/components/parameters/Imsi'
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    post:
      tags: [subscribers]
      summary: terminated の加入者を inactive に戻す
      operationId: reinstateSubscriber
      description: |
        理由は必須で、監査ログ（`subscriber.reinstate`）に残す。
        システム管理者だけに許すことは呼び出し側（aka-ossbss）が守る。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reinstate'
            example:
              reason: 誤って解約した
      responses:
        '200':
          description: 戻した後の加入者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '409':
          description: 加入者が `terminated` でない。`cause` は `STATE_TRANSITION_NOT_ALLOWED`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers/batch-get:
    parameters:
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    post:
      tags: [subscribers]
      summary: 加入者を一括で取得する
      operationId: batchGetSubscribers
      description: |
        IMSI を 1〜500 件受け取り、ある加入者と、ない IMSI を返す。
        重なった IMSI は 1 つにまとめ、どちらも要求の順に返す。台帳との突き合わせと一括投入の前の確かめに使う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGetRequest'
      responses:
        '200':
          description: ある加入者と、ない IMSI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGetResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [sessions]
      summary: セッションの一覧を取得する
      operationId: listSessions
      description: |
        `tenantId` か `imsi` のどちらか 1 つで絞る（両方・どちらもなしは 400）。テナントは、Access-Accept のときの刻印のテナント。
        期限の早い順（最後に Accounting が届いたのが古い順）に返す。期限を過ぎたものは返さない。
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: imsi
          in: query
          description: IMSI のカンマ区切り（100 件まで）。
          schema:
            type: string
        - name: cursor
          in: query
          description: 前のページの `nextCursor`。
          schema:
            type: string
            pattern: '^[0-9]{1,9}$'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: セッションの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /usage:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [sessions]
      summary: 利用の集計を取得する
      operationId: listUsage
      description: |
        日本時間の 1 日の、テナント・IMSI ごとの利用の集計を、テナントと IMSI の辞書順に返す（課金レコード §5.2）。
        集計は 7 日前の日まで取り出せる。その日が終わる前は途中の値。aka-ossbss が毎日と締めのときに取り込む。
      parameters:
        - name: date
          in: query
          required: true
          description: 日本時間の日付。
          schema:
            type: string
            format: date
            example: '2026-10-28'
        - name: cursor
          in: query
          description: 前のページの `nextCursor`。
          schema:
            type: string
            pattern: '^[0-9]{1,19}:[0-9]{15}$'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: 利用の集計
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [config]
      summary: RADIUS クライアントの一覧を取得する
      operationId: listClients
      description: |
        RADIUS クライアント（エッジのトンネルの IP）を IP の順にすべて返す（エッジの数だけなので、ページ送りはしない）。
        共有シークレットは返さない。登録・変更・削除はノードの上のコマンド `aka-radius client` だけで行う。
      responses:
        '200':
          description: RADIUS クライアントの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientList'
        '500':
          $ref: '#/components/responses/InternalError'

  /sources:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [config]
      summary: 認証ベクターの取得先の登録簿を取得する
      operationId: listSources
      description: |
        取得先の登録簿（ノードの上のファイル。SIGHUP で読み直す）を、ファイルの順に返す。鍵とファイルのパスは返さない。
        遮断器の状態は auth が報告したもの（状態が変わったときと 30 秒ごと）。
      responses:
        '200':
          description: 取得先の登録簿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
        '500':
          $ref: '#/components/responses/InternalError'

  /audit-logs:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [logs]
      summary: 監査ログを取得する
      operationId: listAuditLogs
      description: 新しい順に返す。続きを取得するには、応答の `nextBefore` を次の `before` に渡す。
      parameters:
        - name: before
          in: query
          description: このエントリID より古いものを返す。省略時は最新から返す。
          schema:
            type: string
            pattern: '^[0-9]{1,20}-[0-9]{1,20}$'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: 監査ログ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    Imsi:
      name: imsi
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Imsi'
    OperatorId:
      name: X-Operator-Id
      in: header
      required: false
      description: 操作者 ID。監査ログに記録する。
      schema:
        type: string
        pattern: '^[A-Za-z0-9._@-]{1,64}$'
    TraceId:
      name: X-Trace-ID
      in: header
      required: false
      description: |
        トレースID。ログの `trace_id` と監査ログの `traceId` に使う。省略時、または形式が違う（印字可能ASCII 1〜64文字でない）場合は
        サーバーが採番する（16進32桁）。使った値を応答の `X-Trace-ID` ヘッダーで返す（エラーの応答を含む）。
      schema:
        type: string
        pattern: '^[\x21-\x7E]{1,64}$'

  responses:
    BadRequest:
      description: |
        リクエストが不正。`cause` は次のいずれか。項目ごとの理由は `invalidParams` に入る。
        - `INVALID_MSG_FORMAT`: JSON として解釈できない、未知の項目がある
        - `INVALID_QUERY_PARAM`: クエリパラメーターの値が不正
        - `MANDATORY_IE_MISSING`: 必須項目がない
        - `MANDATORY_IE_INCORRECT`: 必須項目の値が不正
        - `OPTIONAL_IE_INCORRECT`: 任意項目（変更の項目を含む）の値が不正
        - `UNKNOWN_SOURCE`: `sourceId` が取得先の登録簿にない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    SubscriberNotFound:
      description: 加入者が存在しない。`cause` は `USER_NOT_FOUND`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: サーバー内部のエラー（Valkey に届かない、Valkey の加入者の形が違うなど）。`cause` は `SYSTEM_FAILURE`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Imsi:
      type: string
      pattern: '^[0-9]{15}$'
      example: '440100123456789'

    SourceId:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
      description: 認証ベクターの取得先の ID（取得先の登録簿の `id`）。
      example: vecgen

    State:
      type: string
      enum: [active, inactive, terminated]
      description: |
        - `active`: 認証する
        - `inactive`: 認証しない（ベクターを取らずに拒否する）。変更・削除できる
        - `terminated`: 認証しない。変更できない。戻すときは reinstate で `inactive` にする

    Rule:
      type: object
      description: |
        認可ポリシーのルール（設計概要 §8.2）。配列の順に評価し、テナント・NAS-Identifier・SSID がすべて一致した最初のルールを採る。
        どれにも一致しなければ拒否する。
      required: [tenantId, nasId, ssids]
      additionalProperties: false
      properties:
        tenantId:
          type: integer
          format: int64
          minimum: 1
          description: エッジが付けるテナントの刻印（Vendor-Specific）の値と一致すること。
        nasId:
          type: string
          minLength: 1
          maxLength: 253
          description: NAS-Identifier。`*` はすべて、それ以外は完全一致（大文字と小文字を区別する）。
        ssids:
          type: array
          minItems: 1
          maxItems: 32
          description: '`["*"]`（すべて）か SSID の配列（大文字と小文字を区別しない）。SSID は Called-Station-Id の最初の `:` より後ろ。'
          items:
            type: string
            minLength: 1
            maxLength: 32
        vlanId:
          type: integer
          minimum: 1
          maximum: 4094
          description: Access-Accept の VLAN（Tunnel-Type・Tunnel-Medium-Type・Tunnel-Private-Group-Id）。省略すると付けない。
        sessionTimeout:
          type: integer
          minimum: 1
          maximum: 86400
          description: Access-Accept の Session-Timeout（秒）。省略すると付けない。

    Rules:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: '#/components/schemas/Rule'

    Subscriber:
      type: object
      required: [imsi, state, stateChangedAt, sourceId, rules, createdAt, updatedAt]
      properties:
        imsi:
          $ref: '#/components/schemas/Imsi'
        state:
          $ref: '#/components/schemas/State'
        stateChangedAt:
          type: string
          format: date-time
          description: 状態が最後に変わった日時（登録を含む）。
        sourceId:
          $ref: '#/components/schemas/SourceId'
        rules:
          $ref: '#/components/schemas/Rules'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubscriberCreate:
      type: object
      required: [imsi, state, sourceId, rules]
      additionalProperties: false
      properties:
        imsi:
          $ref: '#/components/schemas/Imsi'
        state:
          type: string
          enum: [active, inactive]
          description: 登録のときの状態（`terminated` では登録できない）。
        sourceId:
          $ref: '#/components/schemas/SourceId'
        rules:
          $ref: '#/components/schemas/Rules'

    SubscriberUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
        rules:
          $ref: '#/components/schemas/Rules'

    StateChange:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: '#/components/schemas/State'
        reason:
          type: string
          maxLength: 500
          description: 理由（任意）。監査ログに残す。

    Reinstate:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    BatchGetRequest:
      type: object
      required: [imsis]
      additionalProperties: false
      properties:
        imsis:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Imsi'

    BatchGetResult:
      type: object
      required: [items, notFound]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscriber'
        notFound:
          type: array
          items:
            $ref: '#/components/schemas/Imsi'

    SubscriberList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscriber'
        total:
          type: integer
          format: int64
          description: '`prefix` に当たる加入者の数。'
        nextCursor:
          type: string
          description: 次のページがある場合だけ返す。次の `cursor` に渡す。

    SourceStatus:
      type: object
      required: [id, name, baseUrl, timeoutMs, subscriberCount]
      properties:
        id:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
        baseUrl:
          type: string
        timeoutMs:
          type: integer
        clientCertificateNotAfter:
          type: string
          format: date-time
          description: aka-radius のクライアント証明書の期限（読めなければ返さない）。
        subscriberCount:
          type: integer
          format: int64
          description: この取得先を指す加入者の数。
        circuitBreaker:
          $ref: '#/components/schemas/CircuitBreaker'

    CircuitBreaker:
      type: object
      description: |
        auth が報告した取得先の遮断器の状態。報告がまだないか、その取得先が報告にない（登録簿を読み直した直後など）ときは返さない。
        `reportedAt` が 1 分より古ければ、auth が止まっているか Valkey に書けていない。
      required: [state, since, reportedAt]
      properties:
        state:
          type: string
          enum: [closed, half-open, open]
        since:
          type: string
          format: date-time
          description: 今の状態になった時刻（auth が起動したか登録簿を読み直したときは、その時刻）。
        reportedAt:
          type: string
          format: date-time
          description: auth が報告を書いた時刻。

    Certificate:
      type: object
      required: [subject]
      properties:
        subject:
          type: string
          example: CN=aka-radius
        notAfter:
          type: string
          format: date-time
        fingerprint:
          type: string
          description: SHA-256 のフィンガープリント（16 進の小文字。クライアント証明書だけ）。取得先の側の登録と突き合わせる。
          pattern: '^[0-9a-f]{64}$'

    Source:
      type: object
      required: [id, name, baseUrl, timeoutMs, serverCas, subscriberCount]
      properties:
        id:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
        baseUrl:
          type: string
        timeoutMs:
          type: integer
        clientCertificate:
          allOf:
            - $ref: '#/components/schemas/Certificate'
          description: aka-radius のクライアント証明書（読めなければ返さない）。
        serverCas:
          type: array
          description: 取得先のサーバーの CA（読めなければ空）。
          items:
            $ref: '#/components/schemas/Certificate'
        subscriberCount:
          type: integer
          format: int64
          description: この取得先を指す加入者の数。
        circuitBreaker:
          $ref: '#/components/schemas/CircuitBreaker'

    SourceList:
      type: object
      required: [items, loadedAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        loadedAt:
          type: string
          format: date-time
          description: admin が取得先の登録簿を読んだ日時。

    Client:
      type: object
      required: [ip, name, trustStamp, createdAt, updatedAt]
      properties:
        ip:
          type: string
          description: RADIUS クライアント（エッジのトンネル）の IP。
          example: 10.10.0.11
        name:
          type: string
          example: edge-01
        trustStamp:
          type: boolean
          description: このクライアントが付けたテナントの刻印を信頼するか（エッジは true）。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Client'

    Status:
      type: object
      required: [version, build, nodeName, startedAt, subscriberCount, clientCount, sources, sourcesLoadedAt, stampVendorId, stampVendorType, adminClients, adminClientsLoadedAt]
      properties:
        version:
          type: string
          description: 管理API の版。
          example: 2.0.0
        build:
          type: string
          description: ビルドの版。
        nodeName:
          type: string
        startedAt:
          type: string
          format: date-time
        subscriberCount:
          type: integer
          format: int64
        clientCount:
          type: integer
          format: int64
          description: RADIUS クライアントの数。
        sessionCount:
          type: integer
          format: int64
          description: acct が 1 時間ごとの掃除で数えたセッションの数（まだ数えていなければ返さない）。
        sessionsCountedAt:
          type: string
          format: date-time
          description: セッションの数を数えた時刻。
        sources:
          type: array
          description: 取得先の登録簿の取得先（ファイルの順）。
          items:
            $ref: '#/components/schemas/SourceStatus'
        sourcesLoadedAt:
          type: string
          format: date-time
          description: admin が取得先の登録簿を読んだ日時（SIGHUP で読み直す）。
        stampVendorId:
          type: integer
          description: テナントの刻印の Vendor-Id。
          example: 32473
        stampVendorType:
          type: integer
          description: テナントの刻印の Vendor-Type。
          example: 1
        adminClients:
          type: array
          description: 管理クライアントの識別名（辞書順）。
          items:
            type: string
        adminClientsLoadedAt:
          type: string
          format: date-time
          description: admin が管理クライアントのピンのファイルを読んだ日時（SIGHUP で読み直す）。

    Session:
      type: object
      required: [id, imsi, tenantId, nasIp, nasIdentifier, seconds, inOctets, outOctets, expiresAt]
      properties:
        id:
          type: string
          description: セッションの ID（Access-Accept の Class）。
        imsi:
          $ref: '#/components/schemas/Imsi'
        tenantId:
          type: integer
          format: int64
          description: Access-Accept のときの刻印のテナント。
        nasIp:
          type: string
          description: 送信元（エッジのトンネルの IP）。
        nasIdentifier:
          type: string
        callingStationId:
          type: string
        framedIp:
          type: string
        acctSessionId:
          type: string
        startTime:
          type: string
          format: date-time
          description: Accounting-Start を受けた時刻（なければ Access-Accept の時刻）。
        lastUpdate:
          type: string
          format: date-time
        seconds:
          type: integer
          format: int64
          description: Accounting の最後の累計（Acct-Session-Time）。
        inOctets:
          type: integer
          format: int64
          description: Accounting の最後の累計（Acct-Input-Octets と Gigawords）。
        outOctets:
          type: integer
          format: int64
        expiresAt:
          type: string
          format: date-time
          description: セッションの期限（Accounting-Start・Interim で 24 時間に延びる）。

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        nextCursor:
          type: string
          description: 次のページがある場合だけ返す。

    UsageRecord:
      type: object
      required: [date, tenantId, imsi, authOk, sessions, seconds, inOctets, outOctets]
      properties:
        date:
          type: string
          format: date
        tenantId:
          type: integer
          format: int64
          description: 刻印のテナント（刻印がなく分からなければ 0）。
        imsi:
          $ref: '#/components/schemas/Imsi'
        authOk:
          type: integer
          format: int64
          description: 認証の成功（Access-Accept）の回数。
        sessions:
          type: integer
          format: int64
          description: Accounting-Start の数（重複を除く）。
        seconds:
          type: integer
          format: int64
          description: 利用の時間（Acct-Session-Time の増分の合計）。
        inOctets:
          type: integer
          format: int64
          description: 受信の量（Gigawords を含む増分の合計）。
        outOctets:
          type: integer
          format: int64
          description: 送信の量。

    UsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsageRecord'
        nextCursor:
          type: string
          description: 次のページがある場合だけ返す。

    AuditAction:
      type: string
      enum:
        - subscriber.create
        - subscriber.update
        - subscriber.state
        - subscriber.reinstate
        - subscriber.delete
        - client.create
        - client.update
        - client.delete
        - admin-server-certificate.create

    AuditLogEntry:
      type: object
      required: [id, time, operator, mgmtClient, action, target, traceId]
      properties:
        id:
          type: string
          description: エントリID。
        time:
          type: string
          format: date-time
        operator:
          type: string
          description: 操作者 ID。`X-Operator-Id` が省略された場合は空文字列。
        mgmtClient:
          type: string
          description: 管理クライアントの識別名。ノードの上のコマンドの操作は `cli`。
        action:
          $ref: '#/components/schemas/AuditAction'
        target:
          type: string
          description: 対象（加入者は IMSI、RADIUS クライアントは IP、サーバー証明書は `aka-radius-admin`）。
        traceId:
          type: string
          description: トレースID（`X-Trace-ID`）。ログの `trace_id` と同じ。
        detail:
          type: object
          description: |
            変更内容。
            - 登録と削除では、その時点の `state`、`sourceId`、`rules` を含む。
            - 変更では、変更した項目の前後の値（`from`・`to`）を含む。
            - 状態の変更では `state` の前後、理由（`reason`）、同じ状態なら `unchanged`。
            - RADIUS クライアントでは `name`・`trustStamp`（変更は前後の値）。共有シークレットは残さず、変えたときは `"secret": "changed"`。
          additionalProperties: true

    AuditLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        nextBefore:
          type: string
          description: さらに古いエントリがある場合だけ返す。

    InvalidParam:
      type: object
      required: [param]
      properties:
        param:
          type: string
          description: 不正だった項目の名前（例 `rules[0].tenantId`）。
        reason:
          type: string

    ProblemDetails:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        cause:
          type: string
          enum:
            - INVALID_MSG_FORMAT
            - INVALID_QUERY_PARAM
            - MANDATORY_IE_MISSING
            - MANDATORY_IE_INCORRECT
            - OPTIONAL_IE_INCORRECT
            - USER_NOT_FOUND
            - SUBSCRIBER_ALREADY_EXISTS
            - SUBSCRIBER_ACTIVE
            - SUBSCRIBER_TERMINATED
            - STATE_TRANSITION_NOT_ALLOWED
            - UNKNOWN_SOURCE
            - RESOURCE_NOT_FOUND
            - SYSTEM_FAILURE
        invalidParams:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvalidParam'
