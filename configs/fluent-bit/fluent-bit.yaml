service:
  flush: 1
  daemon: false
  log_level: info

parsers:
  - name: json
    format: json
    time_key: false

pipeline:
  inputs:
    - name: forward
      listen: 0.0.0.0
      port: 24224
      mem_buf_limit: 5MB

  filters:
    - name: parser
      match: "app.*"
      key_name: log
      parser: json
      reserve_data: false

    # ヘルスチェックログをリタグしてアプリ専用ログから除外
    - name: rewrite_tag
      match: "app.gateway"
      rule: $path ^/health$ healthcheck.gateway false
      emitter_name: re_emitted_gateway

  outputs:
    - name: file
      match: app.auth
      path: /output_logs
      file: auth.log
      format: plain

    - name: file
      match: app.acct
      path: /output_logs
      file: acct.log
      format: plain

    - name: file
      match: app.gateway
      path: /output_logs
      file: gateway.log
      format: plain

    - name: file
      match: app.admin
      path: /output_logs
      file: admin.log
      format: plain

    - name: file
      match: app.valkey
      path: /output_logs
      file: valkey.log
      format: plain

    # ヘルスチェックログ → others.log
    # （rewrite_tagでapp.*からhealthcheck.*にリタグされたログを収集）
    - name: file
      match: "healthcheck.*"
      path: /output_logs
      file: others.log
      format: plain
