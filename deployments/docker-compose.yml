x-logging: &fluent-bit-logging
  driver: fluentd
  options:
    fluentd-address: localhost:24224
    fluentd-async: "true"
    fluentd-buffer-limit: "1048576"

x-timezone: &timezone
  TZ: Asia/Tokyo

# auth・acct・admin は同じイメージ aka-radius を、サブコマンドを変えて動かす（MVP の設計概要 §4）
x-aka-radius: &aka-radius
  image: aka-radius:${RADIUS_VERSION:-dev}
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      # 起動ログの build に出すビルドの版（例: RADIUS_VERSION=$(git rev-parse --short HEAD)）
      VERSION: ${RADIUS_VERSION:-dev}

# auth・acct・admin に共通の環境変数（Valkey とログ）
x-radius-common-env: &radius-common-env
  <<: *timezone
  RADIUS_VALKEY_HOST: valkey
  RADIUS_VALKEY_PORT: "6379"
  RADIUS_VALKEY_PASSWORD: ${VALKEY_PASSWORD:?deployments/.env に VALKEY_PASSWORD を設定してください}
  RADIUS_LOG_LEVEL: ${RADIUS_LOG_LEVEL:-INFO}
  RADIUS_LOG_MASK_IMSI: ${RADIUS_LOG_MASK_IMSI:-false}

services:
  # ==========================================================================
  # Logic Layer
  # ==========================================================================
  auth:
    <<: *aka-radius
    command: ["auth"]
    ports:
      - "1812:1812/udp"
    environment:
      <<: *radius-common-env
      # 取得先の登録簿（MVP の設計概要 §7.1）。SIGHUP で読み直す: docker compose kill -s HUP auth
      RADIUS_SOURCES_FILE: /etc/aka-radius/sources/sources.json
      RADIUS_FALLBACK_SECRET: ${RADIUS_FALLBACK_SECRET:-}
      RADIUS_EAP_AKA_PRIME_NETWORK_NAME: ${RADIUS_EAP_AKA_PRIME_NETWORK_NAME:-WLAN}
      # テナントの刻印の Vendor-Specific（エッジの設定と同じ値にする。MVP の設計概要 §8.3）
      RADIUS_STAMP_VENDOR_ID: ${RADIUS_STAMP_VENDOR_ID:-32473}
      RADIUS_STAMP_VENDOR_TYPE: ${RADIUS_STAMP_VENDOR_TYPE:-1}
      # 要求 1 つの処理の期限と、同時に処理する要求の上限（MVP の設計概要 §4）
      RADIUS_REQUEST_TIMEOUT: ${RADIUS_REQUEST_TIMEOUT:-4s}
      RADIUS_MAX_INFLIGHT: ${RADIUS_MAX_INFLIGHT:-256}
    volumes:
      # 取得先の登録簿（sources.json）と、取得先ごとのクライアント証明書・鍵・サーバーの CA（中身は .gitignore 対象）
      - ./sources:/etc/aka-radius/sources:ro
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-x", "aka-radius"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      <<: *fluent-bit-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        tag: "app.auth"

  acct:
    <<: *aka-radius
    command: ["acct"]
    ports:
      - "1813:1813/udp"
    environment:
      <<: *radius-common-env
      RADIUS_FALLBACK_SECRET: ${RADIUS_FALLBACK_SECRET:-}
      RADIUS_REQUEST_TIMEOUT: ${RADIUS_REQUEST_TIMEOUT:-4s}
      RADIUS_MAX_INFLIGHT: ${RADIUS_MAX_INFLIGHT:-256}
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-x", "aka-radius"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      <<: *fluent-bit-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        tag: "app.acct"

  # ==========================================================================
  # Management Layer
  # ==========================================================================
  # 管理API 2.0.0（/admin/v2。MVP の設計概要 §11）。aka-provisioner から加入者（状態・取得先・認可ポリシー）を
  # 操作する REST API（HTTPS + mTLS）。証明書の準備が要るため
  # profile に入れており、既定の `docker compose up` では起動しない。
  #   docker compose --profile admin up -d
  # 同じホストの呼び出し側（別の compose）は、ホストの 127.0.0.1 に届かないため、
  # 共有ネットワーク（既定名 eapaka-prov）に参加して https://provisioning-api:9444 で接続する
  # （共有ネットワークの名前と別名は段階 2-5 で決め直す）。
  admin:
    <<: *aka-radius
    command: ["admin"]
    profiles: ["admin"]
    ports:
      # 既定はループバックだけ。別ノードから使う場合は .env の RADIUS_ADMIN_BIND を変える
      - "${RADIUS_ADMIN_BIND:-127.0.0.1}:9444:9444/tcp"
    environment:
      <<: *radius-common-env
      RADIUS_ADMIN_TLS_CERT: /certs/server.pem
      RADIUS_ADMIN_TLS_KEY: /certs/server.key
      # 管理クライアントの「識別名=フィンガープリント」。空なら起動しない
      RADIUS_ADMIN_CLIENTS: ${RADIUS_ADMIN_CLIENTS:-}
      RADIUS_ADMIN_NODE_NAME: ${RADIUS_ADMIN_NODE_NAME:-}
      # GET /audit-logs で参照できる監査ログ（Valkey の Stream audit）の件数の上限
      RADIUS_ADMIN_AUDIT_MAX: ${RADIUS_ADMIN_AUDIT_MAX:-10000}
      # 取得先の登録簿（auth と同じファイル）。加入者の sourceId を確かめ、/status に出す。鍵は読まない。
      # 登録簿を直したら docker compose kill -s HUP auth admin で両方に読み直させる
      RADIUS_SOURCES_FILE: /etc/aka-radius/sources/sources.json
      # /status に出すテナントの刻印の Vendor-Id と Vendor-Type（auth と同じ値にする）
      RADIUS_STAMP_VENDOR_ID: ${RADIUS_STAMP_VENDOR_ID:-32473}
      RADIUS_STAMP_VENDOR_TYPE: ${RADIUS_STAMP_VENDOR_TYPE:-1}
    volumes:
      # サーバー証明書（server.pem / server.key）。SAN に DNS:provisioning-api を入れる
      - ./certs/provisioning:/certs:ro
      - ./sources:/etc/aka-radius/sources:ro
    networks:
      default:
      # 同じホストの呼び出し側用の共有ネットワーク（admin だけを参加させる）。
      # 呼び出し側の設定と証明書の SAN を変えずに済むよう、もとの名前 provisioning-api を別名にする
      provisioning-shared:
        aliases:
          - provisioning-api
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      # /status は mTLS が要るため、プロセスの確認にする
      test: ["CMD", "pgrep", "-x", "aka-radius"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    # 停止の上限（10 秒）が Docker の既定の猶予と同じなので、強制終了と重ならないよう長くする
    stop_grace_period: 20s
    logging:
      <<: *fluent-bit-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        tag: "app.admin"

  # ==========================================================================
  # Data Layer
  # ==========================================================================
  valkey:
    image: valkey/valkey:9.1.2
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    command: >
      valkey-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${VALKEY_PASSWORD:?deployments/.env に VALKEY_PASSWORD を設定してください}
    environment:
      <<: *timezone
      # healthcheck の valkey-cli はパスワードを環境変数で受け取る（コマンドラインの -a は ps に出るため）
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:?deployments/.env に VALKEY_PASSWORD を設定してください}
    healthcheck:
      # PONG が返ることを確かめる（valkey-cli は認証の失敗でも終了コード 0 で終わるため）
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: always
    logging:
      <<: *fluent-bit-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        tag: "app.valkey"

  # ==========================================================================
  # Logging Layer
  # ==========================================================================
  fluent-bit:
    image: fluent/fluent-bit:4.2.8
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml"]
    # Docker のログドライバーはホストの localhost:24224 に接続する。外部には公開しない
    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:24224:24224/udp"
    volumes:
      - ../configs/fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ./logs_on_host:/output_logs
    environment:
      <<: *timezone
    restart: always

volumes:
  valkey_data:

networks:
  # 同じホストの呼び出し側と admin の共有ネットワーク（D-13 §2.2）。
  # 本 compose が作り、呼び出し側は外部ネットワーク（external）として参加する。
  # admin を起動したとき（profile admin）だけ作られる。名前は段階 2-5 で決め直す。
  provisioning-shared:
    name: ${PROVISIONING_SHARED_NETWORK:-eapaka-prov}
