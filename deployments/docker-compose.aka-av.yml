# =============================================================================
# 取得先（aka-vecgen）を同一ホストで動かす場合のオーバーレイ
# =============================================================================
# aka-vecgen の compose が作る共有ネットワーク（既定名 aka-av）に
# auth だけを参加させる。共有ネットワークは aka-vecgen 側が作るので、
# 先に aka-vecgen を起動しておくこと。
#
#   docker compose -f docker-compose.yml -f docker-compose.aka-av.yml up -d
#
# 参加後は https://aka-vecgen:8443 で届く（登録簿の baseUrl は https://aka-vecgen:8443/nudm-ueau/v1）。
# 別ホストの取得先に接続する場合は、このファイルを重ねずに、登録簿の baseUrl を相手ホストのアドレスにする。
# =============================================================================
services:
  auth:
    networks:
      - default
      - aka-av

networks:
  aka-av:
    external: true
    name: ${AKA_SHARED_NETWORK:-aka-av}
